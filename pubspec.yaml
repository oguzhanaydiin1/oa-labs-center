name: oa_center
description: OA Labs Center — OA Labs uygulamalarını tek yerden kur, güncelle ve aç.
publish_to: 'none'
version: 0.3.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  url_launcher: ^6.3.0
  open_filex: ^4.5.0
  ffi: ^2.1.3
  window_manager: ^0.5.1
  tray_manager: ^0.5.0
  local_notifier: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/apps/
    - assets/catalog.json
    - assets/icon/tray.ico
